name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [health-service, auth-service, student-service, dashboard-service, transcript-service, pastpapers-service, frontend]
        # Add each new service's folder name here as you build it, e.g.
        # service: [health-service, auth-service, student-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test

      - name: Build Docker image
        run: docker build -t student-portal/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy env example
        run: cp .env.example .env

      - name: Bring up full pipeline
        run: docker compose up -d --build

      - name: Wait for gateway to route health check
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/health; then
              echo "Pipeline healthy"; exit 0
            fi
            sleep 3
          done
          echo "Pipeline failed to become healthy"; exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
